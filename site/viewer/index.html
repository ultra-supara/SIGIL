<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>SIGIL viewer</title>
<link rel="stylesheet" href="viewer.css">
<script type="module" src="viewer.js"></script>
</head>
<body>
<h1>SIGIL viewer</h1>
<p>Shows the report of a SIGIL session (<code>sigil-session/1</code>) or AI-BOM v2 (<code>sigil-aibom/2</code>), with the CLI's own renderers compiled to WebAssembly. The file stays in your browser: nothing is uploaded.</p>
<p><label>File: <input type="file" id="file" accept=".json,application/json"></label></p>
<p>Specification examples (not measurements):
<button type="button" data-sample="session-14-store-and-runtime.json">Session: PASS, with runtime and API probe</button>
<button type="button" data-sample="session-04-fail-incomplete.json">Session: FAIL, INCOMPLETE</button>
<button type="button" data-sample="aibom-14-store-and-runtime.json">AI-BOM v2: PASS</button>
<button type="button" data-sample="aibom-04-fail-incomplete.json">AI-BOM v2: FAIL, INCOMPLETE</button>
</p>
<p id="error" role="alert" hidden></p>
<p id="actions" hidden><button type="button" id="copy">Copy Markdown</button> <span id="source"></span></p>
<div id="report"></div>
<p><a href="../">SIGIL</a> · <a href="https://github.com/ultra-supara/SIGIL">Source</a></p>
</body>
</html>
