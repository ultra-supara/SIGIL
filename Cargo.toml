[workspace]
members = [
    "crates/sigil-cli",
    "crates/sigil-model",
    "crates/sigil-engine",
    "crates/sigil-probe",
    "crates/sigil-wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/ultra-supara/SIGIL"

[workspace.dependencies]
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive"] }
predicates = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
jsonschema = { version = "0.46", default-features = false }
object = { version = "=0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
toml = "1.1"
