name: Viewer wasm

# crates/sigil-wasm runs the CLI's session and AI-BOM v2 renderers in the browser viewer
# (site/viewer/). The viewer's HTML comes only from its `markdown_html` (U-10).
#
# - `native`: the crate's tests (renders equal the model's, validation, refusals, the viewer
#   samples), and a wasm32 build.
# - `committed-wasm`: the bundle the browser serves (site/viewer/pkg/) must track the source.
#   1. Behaviour: every sample's Markdown and HTML from the committed bundle equal the native
#      render, and every invalid sample gives its manifest's error (ci/check-committed-wasm.mjs).
#   2. Reproducibility: ci/build-viewer-wasm.sh rebuilds the bundle with the pinned rustc
#      (ci/viewer-wasm-toolchain), rust-src, wasm-pack 0.15.0, wasm-bindgen from Cargo.lock,
#      Binaryen (ci/viewer-wasm-opt-version), and remapped paths. Every file must equal the
#      committed one byte for byte (`.js` and `.wasm` included). The `.wasm` must stay within
#      500 KiB gzipped (warning above 90%).
#   3. The viewer's state (load, failure, latest-wins) passes its node tests.
on:
  push:
    branches: [main]
    paths:
      - 'crates/sigil-model/**'
      - 'crates/sigil-wasm/**'
      - 'site/viewer/**'
      - 'schemas/**'
      - 'ci/check-committed-wasm.mjs'
      - 'ci/build-viewer-wasm.sh'
      - 'ci/install-viewer-wasm-opt.sh'
      - 'ci/viewer-wasm-opt-version'
      - 'ci/viewer-wasm-opt.sha256'
      - 'ci/viewer-wasm-toolchain'
      - 'ci/viewer-state.test.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wasm.yml'
  pull_request:
    paths:
      - 'crates/sigil-model/**'
      - 'crates/sigil-wasm/**'
      - 'site/viewer/**'
      - 'schemas/**'
      - 'ci/check-committed-wasm.mjs'
      - 'ci/build-viewer-wasm.sh'
      - 'ci/install-viewer-wasm-opt.sh'
      - 'ci/viewer-wasm-opt-version'
      - 'ci/viewer-wasm-opt.sha256'
      - 'ci/viewer-wasm-toolchain'
      - 'ci/viewer-state.test.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wasm.yml'

permissions:
  contents: read

jobs:
  native:
    name: Viewer renderer tests + wasm32 build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '. -> target'
      - name: Tests (renders, validation, refusals, samples)
        run: cargo test -p sigil-wasm
      - name: Build for wasm32
        run: cargo build -p sigil-wasm --target wasm32-unknown-unknown --release

  committed-wasm:
    name: Committed wasm tracks Rust source (behaviour, reproducible bytes, size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The bundle's rustc, pinned for reproducible bytes: keep equal to ci/viewer-wasm-toolchain
      # (ci/build-viewer-wasm.sh refuses any other).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: nightly-2026-01-20
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '. -> target'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Render the samples natively (source of truth)
        run: |
          set -euo pipefail
          mkdir -p /tmp/expected
          cargo build -q -p sigil-wasm --example render_sample
          for sample in site/viewer/samples/*.json; do
            stem=$(basename "$sample" .json)
            cargo run -q -p sigil-wasm --example render_sample -- "$sample" > "/tmp/expected/$stem.md"
            cargo run -q -p sigil-wasm --example render_sample -- "$sample" --html > "/tmp/expected/$stem.html"
          done
      - name: Behaviour — the committed bundle renders as the source does
        run: node ci/check-committed-wasm.mjs /tmp/expected
      - name: The viewer's state (load, failure, latest-wins)
        run: node --test ci/viewer-state.test.mjs
      - name: Install wasm-pack (pinned)
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Install wasm-opt (pinned release and archive digest)
        run: |
          ci/install-viewer-wasm-opt.sh "$RUNNER_TEMP/viewer-binaryen"
          echo "$RUNNER_TEMP/viewer-binaryen/binaryen-version_$(cat ci/viewer-wasm-opt-version)/bin" >> "$GITHUB_PATH"
      - name: Reproducibility — a rebuild equals the committed bundle, byte for byte
        run: |
          set -euo pipefail
          ci/build-viewer-wasm.sh /tmp/rebuilt
          if ! diff -r site/viewer/pkg /tmp/rebuilt; then
            echo "::error::the committed site/viewer/pkg/ differs from a reproducible rebuild. Follow ci/viewer-wasm-build.md and commit site/viewer/pkg/."
            exit 1
          fi
      - name: Bundle size — warn above 90%, fail above 500 KiB
        run: |
          set -euo pipefail
          size=$(stat -c '%s' site/viewer/pkg/sigil_wasm_bg.wasm)
          gz=$(gzip -c site/viewer/pkg/sigil_wasm_bg.wasm | wc -c)
          max_gz=$((500 * 1024))
          warn_gz=$((max_gz * 90 / 100))
          {
            echo "## Viewer wasm bundle"
            echo
            echo "Pinned build: $(cat ci/viewer-wasm-toolchain), wasm-pack 0.15.0, wasm-opt $(cat ci/viewer-wasm-opt-version); byte equality checked by the preceding step."
            echo
            echo "| .wasm bytes | .wasm gzipped | warning above (90%) | budget (gzipped) | headroom |"
            echo "|---|---|---|---|---|"
            echo "| $size | $gz | $warn_gz | $max_gz | $((max_gz - gz)) |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$gz" -gt "$max_gz" ]; then
            echo "::error::the wasm bundle exceeds 500 KiB gzipped ($gz > $max_gz)"
            exit 1
          elif [ "$gz" -gt "$warn_gz" ]; then
            echo "::warning::the wasm bundle exceeds 90% of the 500 KiB gzip budget ($gz > $warn_gz); $((max_gz - gz)) bytes remain."
          fi
