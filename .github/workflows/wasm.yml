name: Viewer wasm

# crates/sigil-wasm runs the CLI's session and AI-BOM v2 renderers in the browser viewer
# (site/viewer/). The viewer's HTML comes only from its `markdown_html` (U-10).
#
# - `native`: the crate's tests (renders equal the model's, validation, refusals, the viewer
#   samples), and a wasm32 build.
# - `committed-wasm`: the bundle the browser serves (site/viewer/pkg/) must track the source.
#   1. Behaviour: every sample's Markdown and HTML from the committed bundle equal the native
#      render, and every invalid sample gives its manifest's error (ci/check-committed-wasm.mjs).
#   2. A fresh wasm-pack build has the same API surface (.d.ts), stays within 500 KB gzipped,
#      and does not move far in size from the committed one.
on:
  push:
    branches: [main]
    paths:
      - 'crates/sigil-model/**'
      - 'crates/sigil-wasm/**'
      - 'site/viewer/**'
      - 'schemas/**'
      - 'ci/check-committed-wasm.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wasm.yml'
  pull_request:
    paths:
      - 'crates/sigil-model/**'
      - 'crates/sigil-wasm/**'
      - 'site/viewer/**'
      - 'schemas/**'
      - 'ci/check-committed-wasm.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wasm.yml'

permissions:
  contents: read

jobs:
  native:
    name: Viewer renderer tests + wasm32 build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
      - name: Tests (renders, validation, refusals, samples)
        run: cargo test -p sigil-wasm
      - name: Build for wasm32
        run: cargo build -p sigil-wasm --target wasm32-unknown-unknown --release

  committed-wasm:
    name: Committed wasm tracks Rust source (behaviour, API surface, size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Render the samples natively (source of truth)
        run: |
          set -euo pipefail
          mkdir -p /tmp/expected
          cargo build -q -p sigil-wasm --example render_sample
          for sample in site/viewer/samples/*.json; do
            stem=$(basename "$sample" .json)
            cargo run -q -p sigil-wasm --example render_sample -- "$sample" > "/tmp/expected/$stem.md"
            cargo run -q -p sigil-wasm --example render_sample -- "$sample" --html > "/tmp/expected/$stem.html"
          done
      - name: Behaviour — the committed bundle renders as the source does
        run: node ci/check-committed-wasm.mjs /tmp/expected
      - name: Install wasm-pack (pinned)
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Snapshot the committed bundle
        id: before
        run: |
          set -euo pipefail
          mkdir -p /tmp/wasm-before
          cp site/viewer/pkg/sigil_wasm.d.ts site/viewer/pkg/sigil_wasm_bg.wasm.d.ts /tmp/wasm-before/
          {
            echo "size=$(stat -c '%s' site/viewer/pkg/sigil_wasm_bg.wasm)"
            echo "gz=$(gzip -c site/viewer/pkg/sigil_wasm_bg.wasm | wc -c)"
          } >>"$GITHUB_OUTPUT"
      - name: Rebuild
        run: |
          wasm-pack build crates/sigil-wasm --target web --release \
            --out-dir ../../site/viewer/pkg --out-name sigil_wasm
          rm -f site/viewer/pkg/.gitignore
      - name: API surface and size budget
        run: |
          set -euo pipefail
          after_size=$(stat -c '%s' site/viewer/pkg/sigil_wasm_bg.wasm)
          after_gz=$(gzip -c site/viewer/pkg/sigil_wasm_bg.wasm | wc -c)
          before_size='${{ steps.before.outputs.size }}'
          before_gz='${{ steps.before.outputs.gz }}'
          max_gz=$((500 * 1024))
          {
            echo "## Viewer wasm bundle"
            echo
            echo "| Metric | Committed | Rebuilt |"
            echo "|---|---|---|"
            echo "| .wasm bytes | $before_size | $after_size |"
            echo "| .wasm gzipped | $before_gz | $after_gz |"
            echo "| Budget (gzipped) | $max_gz | |"
          } >>"$GITHUB_STEP_SUMMARY"
          fail=0
          if [ "$after_gz" -gt "$max_gz" ]; then
            echo "::error::the wasm bundle exceeds 500 KB gzipped ($after_gz > $max_gz)"
            fail=1
          fi
          for f in sigil_wasm.d.ts sigil_wasm_bg.wasm.d.ts; do
            if ! diff -u "/tmp/wasm-before/$f" "site/viewer/pkg/$f"; then
              echo "::error::the committed $f does not match a fresh build. Run: wasm-pack build crates/sigil-wasm --target web --release --out-dir ../../site/viewer/pkg --out-name sigil_wasm && rm -f site/viewer/pkg/.gitignore, then commit site/viewer/pkg/."
              fail=1
            fi
          done
          # A large size swing almost always means a stale committed bundle.
          delta=$(( after_size > before_size ? after_size - before_size : before_size - after_size ))
          if [ "$delta" -gt $(( before_size / 2 )) ] && [ "$delta" -gt 102400 ]; then
            echo "::error::the wasm size moved by $delta bytes between the committed bundle and a rebuild"
            fail=1
          fi
          exit "$fail"
