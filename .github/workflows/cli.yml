name: CLI

# crates/sigil-cli is the v2 command line: `inspect ollama`, `session render`, `explain`, and
# `rules`. This job runs its end-to-end tests (the real binary, its outputs, and its exit codes)
# on Linux; observe mode reads the runner's own /proc, and the API probe talks to servers on
# loopback started by the tests. It also runs crates/sigil-probe's tests. The syscall contracts
# are the `safety` job.
on:
  push:
    branches: [main]
    paths:
      - 'crates/sigil-cli/**'
      - 'crates/sigil-engine/**'
      - 'crates/sigil-model/**'
      - 'crates/sigil-probe/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'crates/sigil-cli/**'
      - 'crates/sigil-engine/**'
      - 'crates/sigil-model/**'
      - 'crates/sigil-probe/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

jobs:
  cli:
    name: CLI tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
      - name: End-to-end tests (inspect, render, explain, rules, exit codes)
        run: cargo test -p sigil-cli --bin sigil --test cli
      - name: API probe tests (bounds, outcomes, loopback-only rule)
        run: cargo test -p sigil-probe
