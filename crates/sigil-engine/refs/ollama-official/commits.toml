# What each official release's own files report (PR-4c-2c): for each release, the value SIGIL
# reads for an embedded field (`role = "commit"` in signatures/components.toml) from one of the
# release's members. Each member's SHA-256 is in the release's manifest, and SIGIL read these
# values from files with those SHA-256s (R-1, the official v0.30.6 install): the two members are
# byte-identical in v0.30.5, v0.30.6, and v0.30.7.
#
# An open release claim lists the releases whose values agree with the commits an install reports
# (crates/sigil-engine/src/analyze/release.rs, `open`). For reference only, never compared:
# llama.cpp 6f3a9f3dee3c27545371044a3a38005721ac8a8e is its tag b9509, which Ollama v0.30.5,
# v0.30.6, and v0.30.7 pin in LLAMA_CPP_VERSION (v2 plan §0.3).

[[release]]
tag = "v0.30.5"
commits = [
  { field = "LLAMA_COMMIT", member = "lib/ollama/libllama-common.so.0.0.1", value = "6f3a9f3de" },
  { field = "ggml_commit", member = "lib/ollama/libggml-base.so.0.13.1", value = "6f3a9f3de" },
]

[[release]]
tag = "v0.30.6"
commits = [
  { field = "LLAMA_COMMIT", member = "lib/ollama/libllama-common.so.0.0.1", value = "6f3a9f3de" },
  { field = "ggml_commit", member = "lib/ollama/libggml-base.so.0.13.1", value = "6f3a9f3de" },
]

[[release]]
