# SIGIL's built-in policy (docs/policy.md).
# PR-4d-3: runtime_artifacts also audits modeled dependency candidates and supplied-unit values;
# runtime_processes audits requested process values; binary audits modeled dependency candidates.
# These checks retain unexamined launch/loader stages as explicit coverage gaps.
#
# The audit scope holds only what the engine can collect today: the model store; in observe mode,
# the runtime's network exposure and the executables and mappings of the runtime and its
# descendants (`runtime_processes`); and the runtime API's version when the API probe is requested
# (`--active api-probe`). Each later collector adds its scope here.
schema = "sigil-policy/1"
name = "default"

[scope]
audit = ["model_store"]
observe_audit = ["exposure", "runtime_processes"]
active_audit = ["runtime_api"]
# When an installation is inspected (`--install-dir`): its files against the official manifests.
install_audit = ["runtime_artifacts"]
# A binary inspection (`sigil binary inspect`) audits these, plus the code scopes below when code
# is analyzed; the lists above and extra_required are for `inspect ollama`.
binary_audit = ["binary"]
# With code analysis (`request.code`), added after binary_audit, without repeats.
binary_code_audit = ["binary_code"]
extra_required = []

[open_questions]
default = "count_as_gap"

[assumptions]
accept = []

[trust]
principals = ["root", "runtime"]
extra_groups = []
