# SIGIL's built-in policy (docs/policy.md).
#
# The audit scope holds only what the engine can collect today: the model store, and the
# runtime's network exposure in observe mode. Each later collector adds its scope here.
schema = "sigil-policy/1"
name = "default"

[scope]
audit = ["model_store"]
observe_audit = ["exposure"]
extra_required = []

[open_questions]
default = "count_as_gap"

[assumptions]
accept = []

[trust]
principals = ["root", "runtime"]
extra_groups = []
