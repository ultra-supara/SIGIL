# SIGIL's built-in policy (docs/policy.md).
#
# The audit scope holds only what the engine can collect today: the model store, the runtime's
# network exposure in observe mode, and the runtime API's version when the API probe is requested
# (`--active api-probe`). Each later collector adds its scope here.
schema = "sigil-policy/1"
name = "default"

[scope]
audit = ["model_store"]
observe_audit = ["exposure"]
active_audit = ["runtime_api"]
# When an installation is inspected (`--install-dir`): its files against the official manifests.
install_audit = ["runtime_artifacts"]
extra_required = []

[open_questions]
default = "count_as_gap"

[assumptions]
accept = []

[trust]
principals = ["root", "runtime"]
extra_groups = []
