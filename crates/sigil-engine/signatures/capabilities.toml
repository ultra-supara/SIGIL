# libstdc++'s names (PR-4c-3c): exact mangled names that libstdc++.so.6.0.35 exports, matched
# without demangling: the std::filesystem operations that create, remove, rename, copy, or
# resize, for both path ABIs (the __cxx11 path and the old one), each with and without
# std::error_code&; and the ifstream and ofstream constructors and open that take a file name, for
# char and wchar_t, with the three string forms (const char*, the __cxx11 string, the old string).
# source: "libstdc++ <version>: <demangled form>", with [C1] (complete object) or [C2] (base
# object; it takes the VTT as its second argument, so its arity is one more) after a constructor.
# One feature per name: copy and copy_file read too, but writing is what they are for. An
# ifstream's mode always includes in, and an ofstream's always out. cxx.file_write is broader
# than posix.file_write: it includes creating and removing directories, creating links, and
# resizing a file, which the 28 names do not (no mkdir, rmdir, symlink, link, or truncate).
# A missing hint is not absence: a stream constructor that the compiler inlines leaves
# basic_filebuf::open, which is unmapped, as the only import that opens the file; and a statically
# linked libstdc++ (GCC 8's libstdc++fs.a, std::experimental::filesystem) leaves none of these
# names.
# Not mapped: basic_fstream and basic_filebuf::open (the mode decides read or write); permissions
# and last_write_time (metadata); status (exists is inline over it) and the directory iterators
# (they change nothing); every other std::filesystem function (a query, or current_path(p), which
# changes the working directory, not a file); the default and move constructors of the streams
# (they open no file); libc++ (std::__1) and other C++ libraries.

[[capability]]
feature = "cxx.file_read"
symbols = [
  { name = "_ZNSt14basic_ifstreamIcSt11char_traitsIcEEC1EPKcSt13_Ios_Openmode", arity = 3, source = "libstdc++ GLIBCXX_3.4: std::basic_ifstream<char, std::char_traits<char> >::basic_ifstream(char const*, std::_Ios_Openmode) [C1]" },
  { name = "_ZNSt14basic_ifstreamIcSt11char_traitsIcEEC1ERKNSt7__cxx1112basic_stringIcS1_SaIcEEESt13_Ios_Openmode", arity = 3, source = "libstdc++ GLIBCXX_3.4.21: std::basic_ifstream<char, std::char_traits<char> >::basic_ifstream(std::__cxx11::basic_string<char, std::char_traits<char>, std::allocator<char> > const&, std::_Ios_Openmode) [C1]" },
