# Capability imports (PR-5a spec §4.3): v0.1's capability_for_symbol, unchanged in its names.
# Exact names only; a version (connect@GLIBC_2.2.5) is not part of the name.
# arity: the SysV argument registers a call can read (the most, for a variadic function).
[[capability]]
feature = "posix.network"
symbols = [
  { name = "connect", arity = 3 },
  { name = "getaddrinfo", arity = 4 },
  { name = "send", arity = 4 },
  { name = "sendto", arity = 6 },
  { name = "recv", arity = 4 },
  { name = "recvfrom", arity = 6 },
  { name = "socket", arity = 3 },
]

[[capability]]
feature = "posix.file_read"
symbols = [
  { name = "open", arity = 3 },
  { name = "openat", arity = 4 },
  { name = "fopen", arity = 2 },
  { name = "read", arity = 3 },
  { name = "pread", arity = 4 },
]

[[capability]]
feature = "posix.file_write"
symbols = [
  { name = "write", arity = 3 },
  { name = "pwrite", arity = 4 },
  { name = "fwrite", arity = 4 },
  { name = "creat", arity = 2 },
  { name = "rename", arity = 2 },
  { name = "unlink", arity = 1 },
]

[[capability]]
feature = "posix.process_spawn"
symbols = [
  { name = "execve", arity = 3 },
  { name = "fork", arity = 0 },
  { name = "posix_spawn", arity = 6 },
  { name = "system", arity = 1 },
]

[[capability]]
feature = "posix.dynamic_loading"
symbols = [
  { name = "dlopen", arity = 2 },
  { name = "dlsym", arity = 2 },
]

[[capability]]
feature = "posix.environment_access"
symbols = [
  { name = "getenv", arity = 1 },
  { name = "setenv", arity = 3 },
  { name = "putenv", arity = 1 },
]

[[capability]]
feature = "posix.anti_debug"
symbols = [
  { name = "ptrace", arity = 4 },
]
