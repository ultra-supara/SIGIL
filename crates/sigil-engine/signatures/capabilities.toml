# Capability imports (PR-5a spec §4.3): v0.1's capability_for_symbol, unchanged in its names.
# Exact names only; a version (connect@GLIBC_2.2.5) is not part of the name.
# arity: the SysV argument registers a call can read (the most, for a variadic function).
# source: where the name and its meaning come from, required and not blank (PR-4c-3c).
[[capability]]
feature = "posix.network"
symbols = [
  { name = "connect", arity = 3, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): connect()" },
  { name = "getaddrinfo", arity = 4, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): getaddrinfo()" },
  { name = "send", arity = 4, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): send()" },
  { name = "sendto", arity = 6, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): sendto()" },
  { name = "recv", arity = 4, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): recv()" },
  { name = "recvfrom", arity = 6, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): recvfrom()" },
  { name = "socket", arity = 3, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): socket()" },
]

[[capability]]
feature = "posix.file_read"
symbols = [
  { name = "open", arity = 3, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): open()" },
  { name = "openat", arity = 4, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): openat()" },
  { name = "fopen", arity = 2, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): fopen()" },
  { name = "read", arity = 3, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): read()" },
  { name = "pread", arity = 4, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): pread()" },
]

[[capability]]
feature = "posix.file_write"
symbols = [
  { name = "write", arity = 3, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): write()" },
  { name = "pwrite", arity = 4, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): pwrite()" },
  { name = "fwrite", arity = 4, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): fwrite()" },
  { name = "creat", arity = 2, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): creat()" },
  { name = "rename", arity = 2, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): rename()" },
  { name = "unlink", arity = 1, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): unlink()" },
]

[[capability]]
feature = "posix.process_spawn"
symbols = [
  { name = "execve", arity = 3, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): execve()" },
  { name = "fork", arity = 0, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): fork()" },
  { name = "posix_spawn", arity = 6, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): posix_spawn()" },
  { name = "system", arity = 1, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): system()" },
]

[[capability]]
feature = "posix.dynamic_loading"
symbols = [
  { name = "dlopen", arity = 2, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): dlopen()" },
  { name = "dlsym", arity = 2, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): dlsym()" },
]

[[capability]]
feature = "posix.environment_access"
symbols = [
  { name = "getenv", arity = 1, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): getenv()" },
  { name = "setenv", arity = 3, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): setenv()" },
  { name = "putenv", arity = 1, source = "POSIX.1-2024 (IEEE Std 1003.1-2024): putenv()" },
]

[[capability]]
feature = "posix.anti_debug"
symbols = [
  { name = "ptrace", arity = 4, source = "Linux and macOS ptrace(2); not in POSIX" },
]
