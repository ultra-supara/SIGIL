# Signature needles (PR-4c-2a spec §3; plan §4.4.3). The scan looks for each needle in every ELF
# file it applies to, and the first match is one feature hint. A hint says the signal exists in
# the file; it never says the feature is used.
#
#   feature  the hint's feature key
#   kind     export       a prefix of the name of an exported dynamic symbol (.dynsym)
#            go-function  an exact function name in .gopclntab's function-name table, which the
#                         section's header locates, in an ELF file with Go build info (PR-4c-3a);
#                         the value has no NUL
#            string       exact bytes in .rodata, .rodata.*, or .lrodata
#   value    not empty, at most 4096 bytes
#   source   where the value comes from (required, not blank)
#
# The RPC backend is decided by its exports, not by a string: libllama-common's .rodata holds the
# string ggml_backend_rpc_add_server, but it exports no ggml_backend_rpc_* symbol.
#
# The go.* needles (PR-4c-3a) are exported functions of the Go standard library, one capability
# each. Go's linker keeps only the functions a program can reach, and inlined ones keep their
# names. A hint says the function is in the file: presence, never use. The standard library
# reaches some of these for its own use, measured with Go 1.25.6: anything that links net (even
# net.ParseIP alone) has os.Open, through net.open for its configuration files; anything that
# links crypto/x509 (any TLS) has os.ReadFile, through the system roots; anything that links
# net/http (even for http.StatusText) has net.(*Dialer).DialContext, through DefaultTransport;
# and every net/http server has os.Remove, through mime/multipart.(*Form).RemoveAll. So a Go
# server can show go.file_read, go.file_write and go.network without its own code doing any of
# it. In a build without cgo (CGO_ENABLED=0), plugin.Open is a stub that always fails (plugin:
# not implemented), so go.dynamic_loading shows that the program asks for a plugin, not that it
# can load one.
#
# The needles are not a complete list of how a program reaches a capability. Higher-level APIs
# reach these: exec.Command(...).Run, Output, and CombinedOutput call (*Cmd).Start; net.Dial and
# http.Client dial through (*Dialer).DialContext; net.Listen listens through
# (*ListenConfig).Listen. But net.ListenTCP, ListenUDP, DialTCP, and DialUDP go through neither
# DialContext nor ListenConfig, so a program can use the network with no go.network hint.
# Ambiguous names are not listed: os.OpenFile (its flags decide read or write), os.(*File).Write
# and Read (standard output is a file too), and syscall.Syscall and its kin. Nor is the
# environment (os.Getenv): reading it is not a capability in itself, and net, net/http, and
# others read it for their own use. Nor is ptrace.

[[needle]]
feature = "rpc.code_present"
kind = "export"
value = "ggml_backend_rpc_"
source = "llama.cpp b9509 ggml/include/ggml-rpc.h: the RPC backend's functions, ggml_backend_rpc_*"

