# Signature needles (PR-4c-2a spec §3; plan §4.4.3). The scan looks for each needle in every ELF
# file it applies to, and the first match is one feature hint. A hint says the signal exists in
# the file; it never says the feature is used.
#
#   feature  the hint's feature key
#   kind     export       a prefix of the name of an exported dynamic symbol (.dynsym)
#            go-function  an exact function name in .gopclntab's function-name table, which the
#                         section's header locates, in an ELF file with Go build info (PR-4c-3a);
#                         the value has no NUL
#            string       exact bytes in .rodata, .rodata.*, or .lrodata
#   value    not empty, at most 4096 bytes
#   source   where the name comes from (required)
#
# The RPC backend is decided by its exports, not by a string: libllama-common's .rodata holds the
# string ggml_backend_rpc_add_server, but it exports no ggml_backend_rpc_* symbol.
#
# The go.* needles (PR-4c-3a) are exported functions of the Go standard library, one capability
# each. Go's linker keeps only the functions a program can reach, inlined ones keep their names,
# and the standard library reaches some for its own use (a net/http client has os.Open), so a hint
# says the function is in the file, never that the program calls it. Higher-level APIs reach
# these: exec.Command(…).Run, Output, and CombinedOutput call (*Cmd).Start; net.Dial and
# http.Client dial through (*Dialer).DialContext; net.Listen listens through
# (*ListenConfig).Listen. Ambiguous names are not listed: os.OpenFile (its flags decide read or
# write), os.(*File).Write and Read (standard output is a file too), and syscall.Syscall and its
# kin. Nor is the environment (os.Getenv: the standard library reads it in nearly every program)
# or ptrace.

[[needle]]
feature = "rpc.code_present"
kind = "export"
value = "ggml_backend_rpc_"
source = "llama.cpp b9509 ggml/include/ggml-rpc.h: the RPC backend's functions, ggml_backend_rpc_*"

